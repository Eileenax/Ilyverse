<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ilyverse - Inicio</title>
  <link rel="icon" type="image/png" href="/multimedia/icon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'pixel-base': ['Silkscreen', 'sans-serif'],
            'pixel-logo': ['"Press Start 2P"', 'cursive'],
          },
          colors: {
            'ily-purple': {
              100: '#f3f0ff',
              300: '#c77dff',
              500: '#9d4edd',
            },
            'ily-dark': '#0f0c1b',
          },
          backgroundImage: {
            'ily-main-bg': "url('multimedia/download.gif')"
          }
        },
      },
    }
  </script>
</head>
<body class="bg-ily-dark bg-ily-main-bg bg-cover bg-center bg-fixed text-white font-pixel-base min-h-screen flex flex-col justify-between selection:bg-ily-purple-500 selection:text-white">

  <div class="fixed inset-0 bg-ily-dark/40 -z-10"></div>

  <header id="navbar-container"></header>

  <main class="container mx-auto px-4 py-6 sm:py-12 flex-1 flex flex-col items-center justify-center relative z-10">

    <!-- VISTA PÚBLICA -->
    <div id="public-home" class="bg-ily-dark/50 border border-white/10 p-6 sm:p-8 md:p-10 rounded-2xl backdrop-blur-md max-w-3xl w-full shadow-2xl text-center">
      <h1 class="text-sm sm:text-xl md:text-2xl lg:text-3xl font-bold font-pixel-logo text-ily-purple-300 mb-4 sm:mb-6 leading-relaxed sm:leading-tight">
        BIENVENIDO A ILYVERSE
      </h1>
      <p class="text-gray-300 text-[11px] sm:text-xs md:text-sm mb-8 leading-relaxed max-w-xl mx-auto uppercase tracking-wide">
        TU PORTAL PIXELADO. EXPLORA NUESTRA COMUNIDAD Y ACCEDE AL CATÁLOGO DE PRODUCTOS EXCLUSIVOS.
      </p>

      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="/login" class="px-6 py-3.5 bg-ily-purple-500 hover:bg-ily-purple-300 text-white font-bold rounded-lg transition-all duration-200 shadow-md text-xs font-pixel-logo uppercase text-center">
          INICIAR SESIÓN
        </a>
        <a href="/signup" class="px-6 py-3.5 bg-ily-dark/60 hover:bg-ily-purple-500/20 border border-ily-purple-300/60 text-ily-purple-100 font-bold rounded-lg transition-all duration-200 text-xs font-pixel-logo uppercase text-center">
          REGISTRARSE
        </a>
      </div>
    </div>

    <!-- VISTA PRIVADA -->
    <div id="private-home" class="hidden bg-ily-dark/50 border border-white/10 p-6 sm:p-8 md:p-10 rounded-2xl backdrop-blur-md max-w-3xl w-full shadow-2xl text-center">
      <h1 class="text-sm sm:text-xl md:text-2xl font-bold font-pixel-logo text-ily-purple-300 mb-4 sm:mb-6 tracking-wide leading-tight">
        ¡HOLA DE NUEVO!
      </h1>
      
      <p class="text-gray-300 text-xs sm:text-sm md:text-base mb-8">
        Bienvenido/a, <span id="user-name" class="text-ily-purple-300 font-bold font-pixel-logo"></span>. Tu sesión está activa.
      </p>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 my-6 max-w-xl mx-auto">
        <a href="/store" class="group bg-ily-dark/40 border border-white/10 hover:border-ily-purple-300/50 p-6 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 hover:scale-[1.02] hover:bg-ily-purple-500/10">
          <div class="text-4xl sm:text-5xl mb-3 transform group-hover:scale-110 transition-transform">🛒</div>
          <h2 class="text-base sm:text-lg font-pixel-logo text-ily-purple-100 group-hover:text-white mb-2">TIENDA</h2>
          <p class="text-[11px] sm:text-xs text-gray-400 text-center leading-relaxed">Explora y gestiona los productos de Ilyverse.</p>
        </a>

        <div class="bg-ily-dark/40 border border-white/10 p-6 rounded-2xl flex flex-col items-center justify-center">
          <div class="text-4xl sm:text-5xl mb-3">👾</div>
          <h2 class="text-base sm:text-lg font-pixel-logo text-ily-purple-100 mb-2">PERFIL</h2>
          <p id="user-role-badge" class="text-[10px] sm:text-xs px-3 py-1.5 bg-ily-purple-500/30 border border-ily-purple-300/40 rounded-full text-ily-purple-100 uppercase tracking-widest mt-2">
            USUARIO ACTIVO
          </p>
        </div>
      </div>

      <button id="logout-btn" class="mt-4 px-6 py-3 bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-300 font-bold rounded-lg transition-all duration-200 uppercase text-xs">
        Cerrar Sesión
      </button>
    </div>

  </main>

  <footer id="footer-container"></footer>

  <script type="module" src="./index.js"></script>
</body>
</html>
