<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ilyverse - Stream Hub</title>
    <!-- cdn de tailwind css -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-[#0f0c1b] text-[#f3f0ff] min-h-screen flex flex-col font-sans"
  >
    <!-- navbar -->
    <nav
      class="flex justify-between items-center px-8 py-6 border-b border-[#c77dff]/20"
    >
      <div class="text-2xl font-bold tracking-wide">
        <span
          class="text-[#c77dff] drop-shadow-[0_0_10px_rgba(199,125,255,0.5)]"
          >ily</span
        >verse
      </div>
      <div class="flex gap-4">
        <a
          href="/login"
          class="px-5 py-2 rounded-lg font-semibold border border-[#c77dff]/30 text-[#f3f0ff] hover:bg-[#c77dff]/10 hover:border-[#c77dff] transition-all"
          >Iniciar sesión</a
        >
        <a
          href="/signup"
          class="px-5 py-2 rounded-lg font-semibold bg-gradient-to-r from-[#9d4edd] to-[#c77dff] text-white shadow-[0_0_15px_rgba(157,78,221,0.4)] hover:shadow-[0_0_20px_rgba(199,125,255,0.7)] hover:-translate-y-0.5 transition-all"
          >Registrarse</a
        >
      </div>
    </nav>

    <!-- seccion principal (hero) -->
    <main class="flex-1 flex justify-center items-center text-center p-6">
      <div class="max-w-2xl">
        <span
          class="inline-block bg-[#9d4edd]/15 text-[#c77dff] border border-[#c77dff]/20 px-4 py-1.5 rounded-full text-sm font-semibold mb-6"
        >
          Comunidad & Streaming
        </span>
        <h1 class="text-4xl md:text-5xl font-extrabold mb-4 leading-tight">
          Bienvenido al <span class="text-[#c77dff]">ilyverse</span>
        </h1>
        <p class="text-[#a09abc] text-lg mb-8 leading-relaxed">
          Tu punto de encuentro oficial. conecta, participa en las dinámicas del
          stream y forma parte de la comunidad.
        </p>

        <div class="flex justify-center gap-4">
          <a
            href="/signup"
            class="px-8 py-3 rounded-lg text-base font-semibold bg-gradient-to-r from-[#9d4edd] to-[#c77dff] text-white shadow-[0_0_15px_rgba(157,78,221,0.4)] hover:shadow-[0_0_20px_rgba(199,125,255,0.7)] hover:-translate-y-0.5 transition-all"
            >Unirme a la comunidad</a
          >
          <a
            href="/login"
            class="px-8 py-3 rounded-lg text-base font-semibold border border-[#c77dff]/30 text-[#f3f0ff] hover:bg-[#c77dff]/10 hover:border-[#c77dff] transition-all"
            >Ingresar</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
