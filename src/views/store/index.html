<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ily Store | Ilyverse</title>

  <!-- Favicon de la página -->
  <link rel="icon" type="image/png" href="/multimedia/icon.png" />

  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tipografías pixeladas desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <!-- Configuración de colores Cyberpunk para Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ily-dark': '#0c0714',
            'ily-card': '#150c27',
            'ily-purple': '#a855f7',
            'ily-purple-300': '#c084fc',
          },
          fontFamily: {
            'pixel-logo': ['"Press Start 2P"', 'cursive'],
            'pixel-base': ['"VT323"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    .bg-main-wallpaper {
      background-image: url('/multimedia/download.gif'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>

<body class="bg-ily-dark text-white min-h-screen flex flex-col font-pixel-base selection:bg-ily-purple selection:text-white bg-main-wallpaper relative">

  <!-- Capa oscura semitransparente suave para legibilidad -->
  <div class="fixed inset-0 bg-black/20 pointer-events-none z-0"></div>

  <!-- Wrapper superior -->
  <div class="relative z-10 flex flex-col min-h-screen">

    <!-- Receptáculo de la barra de navegación -->
    <div id="navbar-container"></div>

    <!-- Main centrado -->
    <main class="flex-1 container mx-auto px-4 py-8 max-w-5xl flex flex-col justify-center">
      
      <!-- Tarjeta Flotante Transparente -->
      <div class="bg-ily-dark/60 border border-white/10 rounded-3xl p-6 sm:p-10 backdrop-blur-md shadow-[0_0_40px_rgba(0,0,0,0.5)]">
        
        <!-- Encabezado de la Tienda -->
        <div class="flex flex-col items-center justify-center text-center mb-6 relative">
          
          <h1 class="text-2xl sm:text-3xl font-pixel-logo tracking-wider mb-2 text-white">
            Ily<span class="text-ily-purple-300 drop-shadow-[0_0_12px_rgba(192,132,252,0.8)]">Store</span>
          </h1>
          
          <p class="text-gray-300 text-lg sm:text-xl font-pixel-base tracking-wide">
            ¡Sé un niño toro real!
          </p>

          <!-- Botón de carrito superior derecho -->
          <button id="cart-drawer-btn" class="mt-4 sm:mt-0 sm:absolute sm:right-0 sm:top-0 flex items-center gap-2 bg-purple-950/60 hover:bg-purple-900/80 border border-purple-500/50 text-white font-pixel-base px-4 py-1.5 rounded-full shadow-[0_0_15px_rgba(168,85,247,0.3)] transition-all cursor-pointer">
            <span class="text-sm">🛒 Carrito</span>
            <span id="cart-count" class="bg-ily-purple-300 text-black text-[10px] font-pixel-logo px-2 py-0.5 rounded-full font-bold">0</span>
          </button>

          <!-- Acciones de Administrador -->
          <div id="admin-actions" class="mt-4"></div>
        </div>

        <!-- APARTADO DE FILTROS POR CATEGORÍA -->
        <div id="category-filters" class="flex flex-wrap justify-center gap-2 mb-8">
          <button data-category="TODOS" class="category-filter-btn px-4 py-1.5 rounded-xl font-pixel-base text-sm uppercase bg-ily-purple text-white shadow-[0_0_10px_rgba(168,85,247,0.5)] transition-all cursor-pointer">
            Todos
          </button>
          <button data-category="CAMISA" class="category-filter-btn px-4 py-1.5 rounded-xl font-pixel-base text-sm uppercase bg-purple-950/60 hover:bg-purple-900 text-gray-300 border border-white/10 transition-all cursor-pointer">
            Camisas
          </button>
          <button data-category="HOODIE" class="category-filter-btn px-4 py-1.5 rounded-xl font-pixel-base text-sm uppercase bg-purple-950/60 hover:bg-purple-900 text-gray-300 border border-white/10 transition-all cursor-pointer">
            Hoodies
          </button>
          <button data-category="TAZA" class="category-filter-btn px-4 py-1.5 rounded-xl font-pixel-base text-sm uppercase bg-purple-950/60 hover:bg-purple-900 text-gray-300 border border-white/10 transition-all cursor-pointer">
            Tazas
          </button>
          <button data-category="MOUSEPAD" class="category-filter-btn px-4 py-1.5 rounded-xl font-pixel-base text-sm uppercase bg-purple-950/60 hover:bg-purple-900 text-gray-300 border border-white/10 transition-all cursor-pointer">
            Mouse pads
          </button>
          <button data-category="FORRO" class="category-filter-btn px-4 py-1.5 rounded-xl font-pixel-base text-sm uppercase bg-purple-950/60 hover:bg-purple-900 text-gray-300 border border-white/10 transition-all cursor-pointer">
            Forros
          </button>
          <button data-category="CONTROL" class="category-filter-btn px-4 py-1.5 rounded-xl font-pixel-base text-sm uppercase bg-purple-950/60 hover:bg-purple-900 text-gray-300 border border-white/10 transition-all cursor-pointer">
            Gaming
          </button>
        </div>

        <!-- Rejilla de productos -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
          <div class="col-span-full text-center py-16">
            <p class="text-ily-purple-300 text-base font-pixel-logo animate-pulse drop-shadow-[0_0_8px_rgba(192,132,252,0.8)]">⏳ Cargando catálogo espacial...</p>
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- PANEL / DRAWER DEL CARRITO (Oculto por defecto) -->
  <div id="cart-drawer" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="bg-ily-card border-l border-ily-purple/40 w-full max-w-md h-full p-6 flex flex-col justify-between shadow-2xl">
      <div>
        <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
          <h2 class="text-sm font-pixel-logo text-ily-purple-300">🛒 Tu Carrito</h2>
          <button id="close-cart-btn" class="text-gray-400 hover:text-white text-xl font-bold cursor-pointer">✕</button>
        </div>

        <!-- Lista de elementos en el carrito -->
        <div id="cart-items-container" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2 font-pixel-base text-lg">
          <p class="text-gray-400 text-center py-8">El carrito está vacío</p>
        </div>
      </div>

      <!-- Total y Botón de Pago -->
      <div class="border-t border-white/10 pt-4 mt-4 font-pixel-base">
        <div class="flex justify-between items-center mb-4 text-xl">
          <span class="text-gray-300">Total:</span>
          <span class="text-ily-purple-300 font-bold text-2xl">$<span id="cart-total-amount">0.00</span></span>
        </div>
        <button id="checkout-btn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold uppercase transition-colors shadow-lg cursor-pointer text-lg">
          Ir a Pagar
        </button>
      </div>
    </div>
  </div>

  <!-- VENTANA MODAL DE NUEVO / EDITAR PRODUCTO -->
  <div id="product-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-ily-card/95 border border-ily-purple/40 rounded-2xl w-full max-w-md p-6 shadow-[0_0_30px_rgba(168,85,247,0.2)] relative">
      
      <h2 id="modal-title" class="font-pixel-logo text-xs text-ily-purple-300 mb-6 text-center tracking-wide">
        ➕ Nuevo producto
      </h2>

      <form id="product-form" class="flex flex-col gap-4 text-sm font-pixel-base">
        <div>
          <label class="block text-gray-300 mb-1 uppercase tracking-wider">Nombre del producto</label>
          <input type="text" id="prod-name" required placeholder="ej: Ily Hoodie" class="w-full bg-ily-dark border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-ily-purple transition-colors" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-gray-300 mb-1 uppercase tracking-wider">Precio ($)</label>
            <input type="number" id="prod-price" step="0.01" required placeholder="45" class="w-full bg-ily-dark border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-ily-purple transition-colors" />
          </div>
          <div>
            <label class="block text-gray-300 mb-1 uppercase tracking-wider">Categoría</label>
            <select id="prod-category" required class="w-full bg-ily-dark border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-ily-purple transition-colors uppercase cursor-pointer">
              <option value="" disabled selected>Selecciona</option>
              <option value="CAMISA">Camisa</option>
              <option value="HOODIE">Hoodie</option>
              <option value="TAZA">Taza</option>
              <option value="MOUSEPAD">Mouse pad</option>
              <option value="FORRO">Forro de teléfono</option>
              <option value="CONTROL">Control / Accesorio</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-gray-300 mb-1 uppercase tracking-wider">Imagen del producto</label>
          <input type="file" id="prod-image-file" accept="image/*" class="w-full bg-ily-dark border border-white/10 rounded-xl px-3 py-2 text-white text-xs file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-pixel-base file:bg-ily-purple file:text-white hover:file:bg-purple-600 transition-colors cursor-pointer" />
        </div>

        <div>
          <label class="block text-gray-300 mb-1 uppercase tracking-wider">Descripción</label>
          <textarea id="prod-description" rows="2" placeholder="Descripción opcional..." class="w-full bg-ily-dark border border-white/10 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-ily-purple transition-colors resize-none"></textarea>
        </div>

        <div class="flex gap-3 mt-4 pt-2 border-t border-white/10">
          <button type="button" id="cancel-modal-btn" class="flex-1 py-2 bg-gray-800 hover:bg-gray-700 border border-white/10 text-gray-300 rounded-xl transition-colors font-bold uppercase cursor-pointer">Cancelar</button>
          <button type="submit" class="flex-1 py-2 bg-ily-purple hover:bg-purple-600 text-white rounded-xl transition-colors font-bold uppercase shadow-lg cursor-pointer">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DE SIMULACIÓN DE PAGO -->
  <div id="checkout-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-ily-card border border-ily-purple/40 rounded-2xl w-full max-w-sm p-6 text-center shadow-2xl">
      <h3 class="font-pixel-logo text-xs text-ily-purple-300 mb-4">💳 Simulación de Pago</h3>
      <p class="text-gray-300 text-sm mb-6">¿Estás lista para confirmar tu compra simulada?</p>
      
      <div class="flex flex-col gap-3 font-pixel-base">
        <button id="confirm-purchase-btn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold uppercase transition-colors cursor-pointer text-lg">
          Pagar Ahora
        </button>
        <button id="back-to-cart-btn" class="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 border border-white/10 rounded-xl font-bold uppercase transition-colors cursor-pointer text-lg">
          Volver al Carrito
        </button>
      </div>
    </div>
  </div>

  <!-- Script de la vista -->
  <script type="module" src="/store/index.js"></script>

</body>
</html>
